name: Deploy su GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      
      - name: Setup Node.js 
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build
        run: npm run build 

      - name: Upload artefatto
        uses: actions/upload-pages-artifact@v7
        with:
          path: dist
  
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Deploy su Github Pages
        uses: actions/deploy-pages@v5
        
